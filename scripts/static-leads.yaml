rules:
  - id: paragraph-interpolation-python
    languages: [python]
    severity: INFO
    message: Inspect the input's escaping and caller before testing paragraph markup handling.
    pattern: return "<p>" + $VALUE + "</p>"
  - id: paragraph-interpolation-javascript
    languages: [javascript, typescript]
    severity: INFO
    message: Inspect the input's escaping, exports and caller before testing markup handling.
    pattern: return "<p>" + $VALUE + "</p>";
  - id: paragraph-interpolation-java
    languages: [java]
    severity: INFO
    message: Inspect argument types, escaping and caller; the current string probe needs public static String.
    pattern: return "<p>" + $VALUE + "</p>";
  - id: solidity-tx-origin-auth
    languages: [solidity]
    severity: WARNING
    message: Inspect tx.origin authorization checks for phishing or intermediary caller bypass.
    pattern-either:
      - pattern: tx.origin == $ADDR
      - pattern: $ADDR == tx.origin
      - pattern: tx.origin != $ADDR
      - pattern: $ADDR != tx.origin
  - id: solidity-delegatecall
    languages: [solidity]
    severity: WARNING
    message: Inspect delegatecall target, calldata validation and storage layout alignment.
    pattern: $TARGET.delegatecall(...)
  - id: solidity-selfdestruct
    languages: [solidity]
    severity: WARNING
    message: Inspect access control and irreversible state impact around selfdestruct.
    pattern-either:
      - pattern: selfdestruct($ADDR)
      - pattern: suicide($ADDR)
  - id: solidity-abi-encode-packed-hash
    languages: [solidity]
    severity: INFO
    message: Inspect abi.encodePacked hash preimages with dynamic types for collision risks.
    pattern: keccak256(abi.encodePacked(...))
  - id: solidity-ecrecover-malleability
    languages: [solidity]
    severity: INFO
    message: Inspect ecrecover usage for zero-address signer return and signature malleability checks.
    pattern: ecrecover($HASH, $V, $R, $S)
  - id: solidity-unchecked-lowlevel-call
    languages: [solidity]
    severity: WARNING
    message: Inspect low-level external call value/return handling and access/reentrancy guards.
    pattern-either:
      - pattern: $TARGET.call(...)
      - pattern: $TARGET.call{...}(...)
  - id: solidity-eth-transfer
    languages: [solidity]
    severity: WARNING
    message: Inspect value extraction, authorization, and reentrancy protections around external ETH transfer.
    pattern-either:
      - pattern: $TARGET.transfer($AMT)
      - pattern: $TARGET.send($AMT)
  - id: solidity-msg-value-loop
    languages: [solidity]
    severity: WARNING
    message: Inspect msg.value reads inside loops for double-spend or accounting inflation risks.
    patterns:
      - pattern-inside: |
          for (...) {
            ...
          }
      - pattern: msg.value
  - id: solidity-unguarded-initializer
    languages: [solidity]
    severity: WARNING
    message: Inspect initialize/init functions for missing initializer modifier or caller restrictions.
    pattern-either:
      - pattern: |
          function initialize(...) external {
            ...
          }
      - pattern: |
          function initialize(...) public {
            ...
          }
