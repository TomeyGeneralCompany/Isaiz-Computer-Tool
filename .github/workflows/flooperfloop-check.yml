name: Fictional Flooperfloop integration check
on:
  push:
    branches: [verification/flooperfloop-20261019]
concurrency:
  group: fictional-flooperfloop
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fictional-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install sandbox for owned fictional source only
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - name: Check fictional Flooperfloop through production entry points
        run: node --import tsx scripts/test-flooperfloop.ts
