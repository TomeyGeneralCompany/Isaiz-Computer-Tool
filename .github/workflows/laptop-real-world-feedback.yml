name: LOTUS laptop real-world feedback
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: lotus-laptop-real-world
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Require green PR gauntlet and checks before laptop execution
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          prs="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")]')"
          head="$(jq -r '.[0].head.sha // empty' <<< "$prs")"
          if [[ -z "$head" ]]; then
            echo "Not a merged PR commit; refusing laptop execution"
            exit 0
          fi
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100" --jq '.workflow_runs')"
          for name in "AutoHack static checks" "Source reproduction languages" "Actual local-model production-controller acceptance" "LOTUS Production Fidelity Gauntlet"; do
            if ! jq -e --arg name "$name" '[.[] | select(.name == $name)] | length > 0' <<< "$runs" >/dev/null; then
              echo "Missing required workflow: $name"
              exit 0
            fi
            if ! jq -e --arg name "$name" '[.[] | select(.name == $name)] | all(.conclusion == "success")' <<< "$runs" >/dev/null; then
              echo "Non-green workflow: $name"
              exit 0
            fi
          done
          echo "approved=true" >> "$GITHUB_OUTPUT"
  laptop:
    needs: gate
    if: needs.gate.outputs.approved == 'true'
    runs-on: [self-hosted, linux, x64, lotus-laptop]
    timeout-minutes: 1440
    env:
      LOCAL_OLLAMA_MODEL: qwen3:4b
      LOCAL_MODEL_ADAPTER: ollama
      LOCAL_OLLAMA_TOOL_PROTOCOL: json
      LOCAL_MODEL_PROFILE: deterministic
      LOCAL_CONTROLLER_OWNED_ACTIONS: 'true'
      AUTOHACK_AUTO_SOURCE_PREFETCH: 'true'
      AUTOHACK_GUIDED_SOURCE_PROBES: 'true'
      LOCAL_HUNT_DYNAMIC_ALLOWANCE: 'true'
      LOCAL_CONTROLLER_FULL_SOURCE_INDEX: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked dependencies and reuse laptop configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          mkdir -p data/repair-feedback
          # Preserve the actual setup failure instead of reporting a fabricated test exit code.
          # The runner is a systemd service: do not assume the interactive shell's
          # checkout name, environment path, or PATH. Find the installed LOTUS state.
          source_root=""
          for candidate in "$HOME/isaiz-bugbounty/autohack-complete" "$HOME/isaiz-bugbounty/autohack" "$HOME/isaiz-bugbounty" "$HOME/lotus"; do
            if [[ -f "$candidate/.env" ]]; then source_root="$candidate"; break; fi
          done
          if [[ -z "$source_root" ]]; then
            while IFS= read -r candidate; do
              if [[ -f "$candidate" ]]; then source_root="${candidate%/.env}"; break; fi
            done < <(find "$HOME" -maxdepth 5 -type f -name .env -not -path '*/node_modules/*' -not -path '*/lotus-github-runner/_work/*' 2>/dev/null | sort)
          fi
          if [[ -z "$source_root" ]]; then
            echo "SETUP_FAILED: no installed LOTUS .env discovered under $HOME" | tee -a data/repair-feedback/setup.log
            exit 1
          fi
          cp "$source_root/.env" .env
          echo "Using local LOTUS configuration from $source_root" | tee -a data/repair-feedback/setup.log
          # Retain the installed database and program eligibility; a clean GitHub
          # checkout has no previously assessed bounty program to investigate.
          if [[ -d "$source_root/data" ]]; then
            cp -a "$source_root/data/." data/
            # The copied checkout is a separate process namespace. Never inherit
            # the installed instance's PID/token-based hunt lock: its owner may
            # still be alive, causing the fresh investigation to fail instantly.
            # Do not remove the lock in the installed source directory.
            rm -f data/supervisor.lock data/orchestrator.lock data/security-hunt.lock
            echo "Restored installed LOTUS state" | tee -a data/repair-feedback/setup.log
          fi
          if ! command -v ollama >/dev/null 2>&1; then
            for bin in /usr/local/bin/ollama /usr/bin/ollama "$HOME/.local/bin/ollama"; do
              if [[ -x "$bin" ]]; then export PATH="${bin%/*}:$PATH"; break; fi
            done
          fi
          if ! command -v ollama >/dev/null 2>&1; then
            echo "SETUP_FAILED: ollama executable not available to runner service" | tee -a data/repair-feedback/setup.log
            exit 1
          fi
          if ! ollama show qwen3:4b >/dev/null 2>&1; then
            echo "SETUP_FAILED: Ollama qwen3:4b unavailable to runner service" | tee -a data/repair-feedback/setup.log
            exit 1
          fi
          echo "SETUP_OK: dependencies, installed state and Ollama model available" | tee -a data/repair-feedback/setup.log
      - name: Run authorized real-world investigation
        id: hunt
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p data/one-bounty data/repair-feedback
          # GitHub's bash runner enables errexit before this script. Capture
          # an actual failed hunt instead of incorrectly labeling it SETUP_FAILED.
          set +e
          bash scripts/run-one-bounty.sh --program immunefi-88mphv3 --timeout-min 60 > data/repair-feedback/terminal.log 2>&1
          status=$?
          set -e
          echo "$status" > data/repair-feedback/exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect full controller and investigation evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data/repair-feedback
          printf '%s\n' "${{ github.sha }}" > data/repair-feedback/commit.txt
          find data/one-bounty -maxdepth 1 -name '*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2- > data/repair-feedback/latest-summary-path.txt || true
          cp data/repair-feedback/latest-summary-path.txt data/repair-feedback/summary-pointer.txt
          # Artifacts include all controller activity/evidence streams; .env and
          # checked-out source credentials are deliberately excluded.
          tar -czf data/repair-feedback/diagnostics.tar.gz data/one-bounty data/logs 2>/dev/null || true
          if [[ ! -f data/repair-feedback/exit-code.txt ]]; then
            echo "SETUP_FAILED" > data/repair-feedback/exit-code.txt
            echo "Investigation did not start; see setup.log and workflow step logs." >> data/repair-feedback/setup.log
          fi
      - name: Upload diagnostic artifact on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotus-real-world-${{ github.run_id }}
          path: |
            data/repair-feedback/**
          retention-days: 30
          if-no-files-found: error
      - name: Open actionable repair ticket on failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(cat data/repair-feedback/exit-code.txt)"
          if [[ "$code" == 0 ]]; then
            echo "Real-world command passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="LOTUS real-world failure: $SHA"
          body="Real-world workflow failed with result $code. SETUP_FAILED means the investigation never started.\n\nCommit: $SHA\nFull diagnostic artifact: https://github.com/$REPO/actions/runs/$RUN\n\nRead the uploaded controller log, summary JSON, and terminal transcript. Fix the cause on a PR, require the four green workflows, merge, and let the next push re-run the laptop test. No automatic submission."
          gh issue create --repo "$REPO" --title "$title" --body "$(printf '%b' "$body")"
          exit 1
