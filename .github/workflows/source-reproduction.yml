name: Source reproduction languages
# Crucible trigger: post-merge Level 6 qualification on main; ordinary PR checks remain independent.
on:
  pull_request:
  push:
    branches: [main, codex/reproduction-integration-fixes]
  workflow_dispatch:
jobs:
  isolated-language-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated reproduction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --prefix scripts/reproduction-runtime --ignore-scripts --no-audit --no-fund
      - name: Install application dependencies for workflow integration
        run: npm ci
      - name: Check harness syntax
        run: node --check scripts/reproduction-runtime/probe.cjs
      - name: Test Solidity model tool protocols
        run: npx tsx scripts/test-solidity-protocol.ts
      - name: Test local Solidity transaction executor
        run: node scripts/test-solidity-sequence.cjs
      - name: Test real Level-5 Solidity public state getter and baseline selection
        run: npx tsx scripts/test-solidity-controller-menu.ts
      - name: Run actual Python, JavaScript, Java and Solidity sandbox probes
        env:
          TOMEY_REPRODUCTION_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -p test_source_reproduction.py -v
      - name: Reproduce controller-owned entry-to-output paths in Python JavaScript and Java
        run: python3 scripts/test-controller-entry-reproduction.py
      - name: Exercise production-sized controller read and probe transitions
        env:
          GITHUB_TOKEN: offline-ci-fixture
        run: npx tsx scripts/test-local-controller.ts --mock
      - name: Validate blind reasoning harness with real isolated probes
        env:
          GITHUB_TOKEN: offline-ci-fixture
        run: |
          npx tsx scripts/test-reasoning-evidence.ts
          npx tsx scripts/test-local-reasoning.ts --mock
          npx tsx scripts/test-local-reasoning.ts --mock --guided --recovery-sequence
          npx tsx scripts/test-local-reasoning.ts --mock --irrelevant-probe
          npx tsx scripts/test-local-reasoning.ts --mock --duplicate-probe
          npx tsx scripts/test-local-reasoning.ts --mock --premature-final
          if npx tsx scripts/test-local-reasoning.ts --mock --wrong-answer; then
            echo "Incorrect classifications must fail the reasoning evaluator"
            exit 1
          fi
      - name: Verify shared controller-owned factual review authority in all four languages
        run: npx tsx scripts/test-controller-review-boundary.ts
      - name: Validate source-to-sink evidence and grounded review rejections
        run: npx tsx scripts/test-review-evidence-chain.ts
      - name: Validate controller-owned actions and grounded source navigation
        run: npx tsx scripts/test-controller-next-action.ts
      - name: Regress owned Level 5 Solidity direct-transaction evidence
        run: npx tsx scripts/test-level5-direct-transaction.ts
      - name: Validate controller-owned Gauntlet grading
        run: npx tsx scripts/test-gauntlet-execution-milestones.ts
      - name: Regress source-grounded stateful Python JavaScript controller planning
        run: npx tsx scripts/test-controller-stateful-candidates.ts
      - name: Verify shared deterministic source-based polyglot probe plans
        run: npx tsx scripts/test-controller-polyglot-plan.ts
      - name: Verify deterministic multi-hop polyglot controller execution
        run: npx tsx scripts/test-controller-investigation-chain.ts
      - name: Validate import-resolved polyglot caller chains against decoys
        run: npx tsx scripts/test-controller-caller-chain.ts
      - name: Regress controller-guided polyglot probes, Solidity ABI state and Gauntlet grading
        run: |
          npx tsx scripts/test-gauntlet-controller-replay.ts
          python3 scripts/test-solidity-observation-classification.py
      - name: Validate evidence-only reviewer without source-navigation action loop
        run: npx tsx scripts/test-evidence-only-review.ts
      - name: Validate polyglot controller trace ranking and Gauntlet event grading
        run: npx tsx scripts/test-gauntlet-controller-evidence.ts
      - name: Validate source-grounded Solidity authorization observations
        run: python3 scripts/test-solidity-access-evidence.py
      - name: Validate bounded evidence-only independent reviewer
        run: npx tsx scripts/test-evidence-only-review.ts
      - name: Test real source audit, report creation and independent replay
        run: npx tsx scripts/test-source-workflow.ts
      - name: Exercise shared production workflow with real isolated probes
        run: |
          node --import tsx scripts/test-production-workflow.ts
          node --import tsx scripts/test-production-workflow.ts --premature-final

      - name: Verify controller-first full source inventory and evidence packets
        run: node --import tsx scripts/test-controller-full-source-index.ts
      - name: Regress shared risk ranking over 2,000-source Crucible challenges
        run: node --import tsx scripts/test-crucible-polyglot-risk-ranking.ts
      - name: Install pinned local static analyzers
        run: bash scripts/install-static-analysis.sh
      - name: Verify vendored upstream rules and positive/negative fixtures
        run: |
          python3 scripts/check-vendored-rules.py
          SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 .venv-static/bin/semgrep --test --config scripts/vendor/semgrep-rules scripts/vendor/semgrep-rules
      - name: Exercise offline static leads on owned source
        run: python3 scripts/test-static-leads.py
  crucible-level6-production:
    needs: isolated-language-probes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[run-crucible]'))
    name: Crucible Level 6 ${{ matrix.language }} production
    strategy:
      fail-fast: false
      matrix:
        language: [solidity, python, javascript, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LOCAL_OLLAMA_MODEL: qwen3:4b
      LOCAL_MODEL_ADAPTER: ollama
      LOCAL_OLLAMA_TOOL_PROTOCOL: json
      LOCAL_HUNT_DYNAMIC_ALLOWANCE: 'true'
      LOCAL_CONTROLLER_FULL_SOURCE_INDEX: 'true'
      LOCAL_HUNT_NUM_PREDICT: '2048'
      SECURITY_AUTO_SUBMIT: 'false'
      SECURITY_AUTO_HUNT_ENABLED: 'false'
      SECURITY_SOURCE_CODE_TIMEOUT_MINUTES: '180'
      AUTOHACK_OLLAMA_URL: http://127.0.0.1:11434/api/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Validate Level 6 source acquisition
        run: node --import tsx scripts/lotus-crucible-run.ts --smoke --level=6 --language="${{ matrix.language }}" --output=data/crucible/smoke
      - name: Install sandbox reproduction runtimes
        timeout-minutes: 45
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap default-jdk-headless
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout 2100 bash scripts/install-reproduction-runtime.sh
      - name: Provision pinned offline scanner dependencies for Level 6
        timeout-minutes: 20
        run: bash scripts/install-static-analysis.sh
      - name: Start local Qwen3 4B model on CPU
        timeout-minutes: 45
        run: |
          docker run -d --name lotus-crucible-ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          docker exec lotus-crucible-ollama ollama pull qwen3:4b
      - name: Run actual Level 6 production investigation
        timeout-minutes: 230
        env:
          CRUCIBLE_LANGUAGE: ${{ matrix.language }}
        run: |
          set -o pipefail
          mkdir -p data/crucible/latest
          node --import tsx scripts/lotus-crucible-run.ts --run --level=6 --language="$CRUCIBLE_LANGUAGE" --output=data/crucible/latest 2>&1 | tee data/crucible/live-terminal.log
      - name: Upload Level 6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crucible-six-${{ matrix.language }}-${{ github.run_id }}
          path: |
            data/crucible/latest/manifest.json
            data/crucible/latest/grade.json
            data/crucible/latest/result.json
            data/crucible/latest/review.json
            data/crucible/latest/local-hunt-*.log
            data/crucible/latest/local-review-*.log
            data/crucible/live-terminal.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local Qwen model
        if: always()
        run: docker rm -f lotus-crucible-ollama || true
  crucible-independent-runtime-oracle:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[run-crucible]'))
    name: Crucible independent ${{ matrix.language }} runtime oracle
    strategy:
      fail-fast: false
      matrix:
        language: [solidity, python, javascript, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install private oracle compiler and EVM
        if: matrix.language == 'solidity'
        run: npm install --prefix scripts/reproduction-runtime --ignore-scripts --no-audit --no-fund
      - name: Reproduce hidden defects and reject secured controls
        run: node --import tsx scripts/lotus-crucible-runtime-oracle.ts "${{ matrix.language }}" runtime-oracle-verification-01
      - name: Verify clean Level 6 trial rejects attacker-controlled input
        run: node --import tsx scripts/lotus-crucible-runtime-oracle.ts "${{ matrix.language }}" runtime-oracle-verification-clean-01 --clean
