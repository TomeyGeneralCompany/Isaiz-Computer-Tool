name: Qwen3 4B real-model smoke
on:
  pull_request:
    paths:
      - .github/workflows/real-qwen-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-qwen-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application and isolated probe prerequisites
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Install Ollama and load the actual Qwen3 4B model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if command -v systemctl >/dev/null; then sudo systemctl stop ollama || true; fi
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/autohack-ollama.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b
      - name: Run real Qwen3 agent and real isolated Python reproduction
        timeout-minutes: 31
        env:
          LOCAL_OLLAMA_MODEL: qwen3:4b
          LOCAL_MODEL_PROFILE: qwen
          LOCAL_OLLAMA_TOOL_PROTOCOL: json
          AUTOHACK_OLLAMA_URL: http://127.0.0.1:11434/api/chat
          LOCAL_HUNT_DYNAMIC_ALLOWANCE: 'false'
        run: |
          node --import tsx scripts/test-production-workflow.ts --real-model --prefetch --variant=0
      - name: Preserve diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-cpu-diagnostics
          path: |
            data/production-workflow-tests/
          if-no-files-found: ignore
