name: AutoHack static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources without running workers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          roots = [Path("scripts"), Path(".autohack-next-stage")]
          paths = [p for root in roots for p in root.rglob("*.py")
                   if "vendor" not in p.parts and "repos" not in p.parts and "__pycache__" not in p.parts]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Validated {len(paths)} Python files")
          PY
      - name: Validate launch scripts
        run: bash -n scripts/run-one-bounty.sh run-local-autohack.sh run-complete-autohack.sh setup-and-run.sh scripts/install-user-service.sh scripts/control-user-service.sh scripts/node-runtime.sh scripts/verify-host.sh scripts/configure-hackerone.sh scripts/verify-model.sh scripts/verify-assessment.sh
      - name: Test offline ingestion
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install and exercise Qwen-Agent local adapter
        run: |
          bash scripts/install-qwen-agent.sh
          node --import tsx scripts/test-qwen-agent-transport.ts
      - run: npx tsc --noEmit --project tsconfig.json
      - name: Verify persisted runtime overrides and token limits
        run: npx tsx scripts/test-runtime-config.ts
      - name: Verify read-only dashboard activity
        run: npx tsx scripts/test-dashboard-activity.ts
      - name: Verify local model HTTP deadlines
        run: |
          npx tsx scripts/test-ollama-http.ts
          npx tsx scripts/test-ollama-stream.ts
          npx tsx scripts/test-ollama-gate.ts
      - name: Exercise direct Ollama agent with mock server
        run: npx tsx scripts/test-mock-agent.ts
      - name: Verify hunt capability, reachability and context management
        run: |
          npx tsx scripts/test-missing-source-loop.ts
          npx tsx scripts/test-investigation-records.ts
          npx tsx scripts/test-source-candidates.ts
          npx tsx scripts/test-guided-source-probes.ts
          npx tsx scripts/test-one-bounty-settings.ts
          npx tsx scripts/test-one-bounty-progress.ts
          node --import tsx scripts/one-bounty.ts --help
          if node --import tsx scripts/one-bounty.ts --timeout-min 0; then echo 'Invalid one-bounty timeout accepted'; exit 1; fi
          npx tsx scripts/test-audit-allowance.ts
          node --import tsx scripts/test-investigation-decisions.ts
          npx tsx scripts/test-progress-controller.ts
          npx tsx scripts/test-hunt-reliability.ts
          npx tsx scripts/test-audit-context-loop.ts
          node --import tsx scripts/test-production-workflow.ts --mock-probes --large-context
          node --import tsx scripts/test-production-workflow.ts --mock-probes --prefetch
          npx tsx scripts/test-audit-output-budget.ts
          npx tsx scripts/test-native-batch.ts
          npx tsx scripts/test-audit-stalls.ts
          npx tsx scripts/test-audit-navigation-recovery.ts
          npx tsx scripts/test-solidity-source-index.ts
          npx tsx scripts/test-submodule-acquisition.ts
      - name: Verify paginated source inspection and evidence spans
        run: npx tsx scripts/test-source-inspection.ts
      - name: Verify state mutex crash recovery and concurrent claims
        run: npx tsx scripts/test-state-mutex.ts
      - name: Exercise production program assessment and truncated output recovery
        run: npx tsx scripts/test-mock-assessment.ts
      - name: Verify authorized source acquisition boundaries
        run: |
          npx tsx scripts/test-authorized-source.ts
          npx tsx scripts/test-preparation-recovery.ts
      - name: Explain dispatch exclusions and validate Signal response parsing
        run: npx tsx scripts/test-program-selection.ts
      - name: Verify supported discovery feeds without network requests
        run: npx tsx scripts/test-discovery-feeds.ts
      - name: Verify read-only provider preflight and credential redaction
        run: npx tsx scripts/test-provider-preflight.ts
      - name: Verify payout ledger behavior
        run: npx tsx scripts/test-earnings.ts
      - name: Verify scope allowlist and denied targets
        run: npx tsx scripts/test-scope.ts
      - name: Verify sequential pipeline and difficulty order
        run: npx tsx scripts/test-sequential-pipeline.ts
      - name: Verify durable daily dispatch quota
        run: npx tsx scripts/test-daily-quota.ts
      - name: Verify submission outbox restart and duplicate safety
        run: npx tsx scripts/test-submission-outbox.ts
      - name: Mock real HackerOne serializer and rejection
        run: npx tsx scripts/test-mock-submission.ts
      - name: Exercise offline scoped full fixture and mock submit
        run: npx tsx scripts/test-offline-end-to-end.ts
      - name: Test scoped bounded HTTP observation
        run: npx tsx scripts/test-scoped-http.ts
      - name: Typecheck dashboard
        run: npx tsc --noEmit --project packages/dashboard/tsconfig.json

  native-sqlite-integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: offline-ci-fixture
      DB_PATH: /tmp/autohack-native-ci-db.sqlite
      CI_SQLITE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile native SQLite dependency
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Create isolated fixture schema through Drizzle
        run: npm run db:push
      - name: Verify progress diagnostic is read-only
        run: npx tsx scripts/test-progress-diagnostic.ts
      - name: Verify local dashboard analysis scheduling
        run: npx tsx scripts/test-analysis-scheduling.ts
      - name: Verify failed source acquisition preserves hunt history
        run: npx tsx scripts/test-hunt-failure.ts
      - name: Verify scope recovery and late bounty updates
        run: npx tsx scripts/test-poller-recovery.ts
      - name: Verify static lead evidence routing with an owned database
        run: npx tsx scripts/test-static-lead-queue.ts
      - name: Test fresh database directory and false-success rejection
        run: npx tsx scripts/test-db-initialization.ts
      - name: Exercise actual SQLite, Drizzle, tRPC dashboard and payment ledger
        run: npx tsx scripts/test-sqlite-pipeline.ts
      - name: Smoke real orchestrator and dashboard startup/restart (offline)
        timeout-minutes: 5
        env:
          CI_DASHBOARD_SMOKE: '1'
        run: python3 scripts/test-service-restart.py
      - name: Build production dashboard against fixture database
        run: npm run build --workspace=packages/dashboard
