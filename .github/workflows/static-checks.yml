name: AutoHack static checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources without running workers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          roots = [Path("scripts"), Path(".autohack-next-stage")]
          paths = [p for root in roots for p in root.rglob("*.py")
                   if "repos" not in p.parts and "__pycache__" not in p.parts]
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Validated {len(paths)} Python files")
          PY
      - name: Validate launch scripts
        run: bash -n run-local-autohack.sh run-complete-autohack.sh setup-and-run.sh scripts/install-user-service.sh scripts/control-user-service.sh
      - name: Test offline ingestion
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit --project tsconfig.json
      - name: Exercise direct Ollama agent with mock server
        run: npx tsx scripts/test-mock-agent.ts
      - name: Verify payout ledger behavior
        run: npx tsx scripts/test-earnings.ts
      - name: Verify scope allowlist and denied targets
        run: npx tsx scripts/test-scope.ts
      - name: Verify durable daily dispatch quota
        run: npx tsx scripts/test-daily-quota.ts
      - name: Verify submission outbox restart and duplicate safety
        run: npx tsx scripts/test-submission-outbox.ts
      - name: Mock real HackerOne serializer and rejection
        run: npx tsx scripts/test-mock-submission.ts
      - name: Exercise offline scoped full fixture and mock submit
        run: npx tsx scripts/test-offline-end-to-end.ts
      - name: Test scoped bounded HTTP observation
        run: npx tsx scripts/test-scoped-http.ts
      - name: Typecheck dashboard
        run: npx tsc --noEmit --project packages/dashboard/tsconfig.json

  native-sqlite-integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: offline-ci-fixture
      DB_PATH: /tmp/autohack-native-ci-db.sqlite
      CI_SQLITE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile native SQLite dependency
        run: npm ci
      - name: Create isolated fixture schema through Drizzle
        run: npm run db:push
      - name: Exercise actual SQLite, Drizzle, tRPC dashboard and payment ledger
        run: npx tsx scripts/test-sqlite-pipeline.ts
      - name: Smoke real orchestrator and dashboard startup/restart (offline)
        timeout-minutes: 5
        env:
          CI_DASHBOARD_SMOKE: '1'
        run: python3 scripts/test-service-restart.py
